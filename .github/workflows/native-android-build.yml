name: Build Native Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}-${{ inputs.variant || 'debug' }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'debug' }}

jobs:
  build-native-android:
    name: Build Native Android (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Resolve Build Metadata
        id: build-info
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Native release is signed with the same four secrets as the RN app.
      - name: Decode Release Keystore
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/native-android/app/release.keystore"

      - name: Verify Release Keystore
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/native-android/app/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Release keystore invalid — check KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          echo "Native release keystore verified."

      - name: Build Debug APK
        if: env.VARIANT != 'release'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/native-android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Cleanup Decoded Keystore
        if: always() && env.VARIANT == 'release'
        run: rm -f "$GITHUB_WORKSPACE/native-android/app/release.keystore"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sorareader-native-${{ env.VARIANT }}-${{ steps.build-info.outputs.short_sha }}-${{ github.run_number }}
          path: native-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
