name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      arch:
        description: 'Target ABI (all = one APK per ABI, never universal)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'auto' }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'debug' }}
  ARCH: ${{ inputs.arch || 'all' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_ENV: production

jobs:
  build-android:
    name: Build Android (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Env File
        run: |
          if [[ "$VARIANT" == "release" ]]; then
            pnpm run generate:env:release \
              --build-type "Release" \
              --node-env "production" \
              --myanimelist-client-id "${{ vars.MYANIMELIST_CLIENT_ID }}" \
              --anilist-client-id "${{ vars.ANILIST_CLIENT_ID }}"
          else
            pnpm run generate:env:debug
          fi

      - name: Setup Android SDK
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Decode Keystore (release only)
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: env.VARIANT != 'release'
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant debug
          else
            pnpm rock build:android --variant debug \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi

      - name: Build Release APK
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant release
          else
            pnpm rock build:android --variant release \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi
          ls android/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sora-reader-${{ env.VARIANT }}-${{ env.ARCH }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Create GitHub Release (release only)
        uses: softprops/action-gh-release@v2
        if: env.VARIANT == 'release'
        with:
          tag_name: build-${{ github.run_number }}
          name: SoraReader Build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
