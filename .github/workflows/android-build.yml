name: Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      arch:
        description: 'Target ABI (all = one APK per ABI, never universal)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'auto' }}-${{ inputs.arch || 'all' }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'debug' }}
  ARCH: ${{ inputs.arch || 'all' }}
  NODE_ENV: production
  CI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-android:
    name: Build Android (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Free Disk Space
        # Pinned to a commit SHA: this third-party action runs with repo access.
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Env File
        run: |
          if [[ "$VARIANT" == "release" ]]; then
            pnpm run generate:env:release \
              --build-type "Release" \
              --node-env "production"
          else
            pnpm run generate:env:debug
          fi

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          # Changes to the component list, Gradle config or this workflow
          # invalidate the cache automatically instead of reusing a stale SDK.
          key: android-sdk-${{ hashFiles('.github/workflows/android-build.yml', 'android/build.gradle', 'android/gradle.properties') }}

      - name: Setup Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Export Android SDK Env
        run: |
          {
            echo "ANDROID_HOME=$HOME/android-sdk"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk"
          } >> "$GITHUB_ENV"
          {
            echo "$HOME/android-sdk/cmdline-tools/latest/bin"
            echo "$HOME/android-sdk/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Decode Keystore (release only)
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      - name: Verify Keystore (release only)
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Release keystore invalid — check KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          echo "Release keystore verified."

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: env.VARIANT != 'release'
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant debug
          else
            pnpm rock build:android --variant debug \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi

      - name: Build Release APK
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant release
          else
            pnpm rock build:android --variant release \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi
          ls android/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sora-reader-${{ env.VARIANT }}-${{ env.ARCH }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Create GitHub Release (release only)
        uses: softprops/action-gh-release@v2
        if: env.VARIANT == 'release'
        with:
          tag_name: build-${{ github.run_number }}
          name: SoraReader Build #${{ github.run_number }}
          # Attach the tag to the exact commit that produced these APKs;
          # otherwise the action defaults to the repo's default branch.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
