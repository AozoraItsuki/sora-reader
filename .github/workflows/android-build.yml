name: Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      arch:
        description: 'Target ABI (all = one APK per ABI, never universal)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a

# Build jobs only need read access; the separate publish job below gets write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'auto' }}-${{ inputs.arch || 'all' }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'debug' }}
  ARCH: ${{ inputs.arch || 'all' }}
  NODE_ENV: production
  CI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-android:
    name: Build Android (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      should_publish: ${{ steps.release-info.outputs.should_publish }}
      tag: ${{ steps.release-info.outputs.tag }}
      version: ${{ steps.release-info.outputs.version }}
      short_sha: ${{ steps.release-info.outputs.short_sha }}
      artifact_name: ${{ steps.release-info.outputs.artifact_name }}
      make_latest: ${{ steps.release-info.outputs.make_latest }}
      prerelease: ${{ steps.release-info.outputs.prerelease }}

    steps:
      - name: Free Disk Space
        # Pinned to a commit SHA: this third-party action runs with repo access.
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # package.json is canonical; CI tags and artifacts are derived from it.
      - name: Resolve Release Metadata
        id: release-info
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          SHOULD_PUBLISH=false
          MAKE_LATEST=false
          PRERELEASE=true
          if [[ "$VARIANT" == "release" ]]; then
            SHOULD_PUBLISH=true
            if [[ "$GITHUB_REF" == "refs/heads/main" && "$ARCH" == "all" ]]; then
              MAKE_LATEST=true
              PRERELEASE=false
            fi
          fi
          {
            echo "version=$VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "tag=v${VERSION}-ci.${GITHUB_RUN_NUMBER}"
            echo "artifact_name=sora-reader-${VARIANT}-${ARCH}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "make_latest=$MAKE_LATEST"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Env File
        run: |
          if [[ "$VARIANT" == "release" ]]; then
            pnpm run generate:env:release \
              --build-type "Release" \
              --node-env "production" \
              --git-hash "${{ github.sha }}"
          else
            pnpm run generate:env:debug --git-hash "${{ github.sha }}"
          fi

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/android-sdk
          # Changes to the component list, Gradle config or this workflow
          # invalidate the cache automatically instead of reusing a stale SDK.
          key: android-sdk-${{ hashFiles('.github/workflows/android-build.yml', 'android/build.gradle', 'android/gradle.properties') }}

      - name: Export Android SDK Env
        run: |
          {
            echo "ANDROID_HOME=$HOME/android-sdk"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk"
          } >> "$GITHUB_ENV"
          {
            echo "$HOME/android-sdk/cmdline-tools/latest/bin"
            echo "$HOME/android-sdk/platform-tools"
          } >> "$GITHUB_PATH"

      # A cache "hit" can still be incomplete (aborted install, partial restore).
      # Clear it and let the setup step below reinstall instead of failing later
      # with an opaque NDK/CMake error.
      - name: Verify Android SDK Components (cache health)
        id: sdk-health
        run: |
          SDK="$ANDROID_HOME"
          missing=()
          check_dir() { [[ -d "$1" ]] || missing+=("$2"); }
          check_dir "$SDK/platforms/android-36" "platform 36"
          check_dir "$SDK/build-tools/36.0.0" "build-tools 36.0.0"
          check_dir "$SDK/cmake/3.22.1" "cmake 3.22.1"
          check_dir "$SDK/ndk/27.1.12297006" "NDK 27.1.12297006"
          check_dir "$SDK/cmdline-tools/latest/bin" "cmdline-tools/latest"
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "SDK incomplete (missing: ${missing[*]}); clearing for reinstall."
            rm -rf "$SDK"
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          else
            echo "SDK components verified."
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true' || steps.sdk-health.outputs.healthy == 'false'
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Decode Keystore (release only)
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      - name: Verify Keystore (release only)
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Release keystore invalid — check KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          echo "Release keystore verified."

      - name: Cleanup Decoded Keystore
        if: always() && env.VARIANT == 'release'
        run: rm -f android/app/release.keystore

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: env.VARIANT != 'release'
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant debug
          else
            pnpm rock build:android --variant debug \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi

      - name: Build Release APK
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$ARCH" == "all" ]]; then
            pnpm rock build:android --variant release
          else
            pnpm rock build:android --variant release \
              --extra-params "-PtargetAbis=$ARCH -PreactNativeArchitectures=$ARCH"
          fi
          ls android/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release-info.outputs.artifact_name }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  # Minimal write-scoped job: it only downloads the built artifact and creates
  # the release, so build steps never hold contents: write.
  publish-release:
    name: Publish GitHub Release
    needs: build-android
    if: needs.build-android.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-android.outputs.artifact_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build-android.outputs.tag }}
          name: SoraReader ${{ needs.build-android.outputs.version }} (${{ needs.build-android.outputs.short_sha }})
          # Attach the tag to the exact commit that produced these APKs;
          # otherwise the action defaults to the repo's default branch.
          target_commitish: ${{ github.sha }}
          make_latest: ${{ needs.build-android.outputs.make_latest }}
          prerelease: ${{ needs.build-android.outputs.prerelease }}
          body: |
            SoraReader ${{ needs.build-android.outputs.version }} — CI build #${{ github.run_number }}
            - Commit: `${{ needs.build-android.outputs.short_sha }}` (${{ github.sha }})
            - Variant: `${{ env.VARIANT }}`
            - Target ABI: `${{ env.ARCH }}`
            - Artifact: `${{ needs.build-android.outputs.artifact_name }}`
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.aab
