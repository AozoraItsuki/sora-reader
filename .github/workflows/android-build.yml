name: Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      arch:
        description: 'Target ABI'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'debug' }}-${{ inputs.arch || 'all' }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'debug' }}
  ARCH: ${{ inputs.arch || 'all' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_ENV: production
  CI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-android:
    name: Build Android (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Env File
        run: |
          if [[ "$VARIANT" == "release" ]]; then
            pnpm run generate:env:release \
              --build-type "Release" \
              --node-env "production" \
              --myanimelist-client-id "${{ vars.MYANIMELIST_CLIENT_ID }}" \
              --anilist-client-id "${{ vars.ANILIST_CLIENT_ID }}"
          else
            pnpm run generate:env:debug
          fi

      - name: Validate Release Signing Secrets
        if: ${{ env.VARIANT == 'release' }}
        shell: bash
        run: |
          set -e
          if [[ -z "${{ secrets.KEYSTORE_B64 }}" ]]; then
            echo "❌ Error: KEYSTORE_B64 secret is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]]; then
            echo "❌ Error: KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_ALIAS }}" ]]; then
            echo "❌ Error: KEY_ALIAS secret is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "❌ Error: KEY_PASSWORD secret is not set"
            exit 1
          fi
          echo "✅ All release signing secrets are configured"

      - name: Setup Android SDK
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Build Android
        id: rock-build
        uses: callstackincubator/android@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          variant: ${{ env.VARIANT }}
          setup-java: false
          validate-gradle-wrapper: true
          re-sign: ${{ env.VARIANT == 'release' }}
          sign: ${{ env.VARIANT == 'release' }}
          keystore-base64: ${{ env.VARIANT == 'release' && secrets.KEYSTORE_B64 || '' }}
          keystore-path: release.keystore
          keystore-store-file: release.keystore
          keystore-store-password: ${{ env.VARIANT == 'release' && secrets.KEYSTORE_PASSWORD || '' }}
          keystore-key-alias: ${{ env.VARIANT == 'release' && secrets.KEY_ALIAS || '' }}
          keystore-key-password: ${{ env.VARIANT == 'release' && secrets.KEY_PASSWORD || '' }}
          rock-build-extra-params: >-
            ${{ env.ARCH != 'all'
              && format('-PtargetAbis={0} -PreactNativeArchitectures={0}', env.ARCH)
              || '' }}

      - name: Show Rock Build Result
        run: |
          echo "${{ steps.rock-build.outputs.artifact-url }}"
          echo "${{ steps.rock-build.outputs.artifact-id }}"
          find android/app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sora-reader-${{ env.VARIANT }}-${{ env.ARCH }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ env.VARIANT == 'release' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SoraReader Build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
