name: Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Architecture to build"
        required: true
        default: "Build all"
        type: choice
        options:
          - Build all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get-version.outputs.version }}
      commit_msg: ${{ steps.get-commit.outputs.message }}
      commit_count: ${{ steps.get-commit.outputs.count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Build Matrix
        id: set-matrix
        run: |
          ALL='[
            {"name":"arm64-v8a","abi":"arm64-v8a","apk_suffix":"arm64-v8a"},
            {"name":"armeabi-v7a","abi":"armeabi-v7a","apk_suffix":"armeabi-v7a"},
            {"name":"x86","abi":"x86","apk_suffix":"x86"},
            {"name":"x86_64","abi":"x86_64","apk_suffix":"x86_64"}
          ]'

          BUILD_TARGET="${{ inputs.build_target }}"

          if [[ "$BUILD_TARGET" == "Build all" ]]; then
            MATRIX="$ALL"
          else
            MATRIX=$(echo "$ALL" | jq -c --arg name "$BUILD_TARGET" '[.[] | select(.name == $name)]')
          fi

          echo "matrix={\"include\":$(echo $MATRIX | jq -c '.')}" >> $GITHUB_OUTPUT

      - name: Get App Version
        id: get-version
        run: |
          MAJOR=$(grep 'versionMajor =' android/app/build.gradle | grep -oP '\d+')
          MINOR=$(grep 'versionMinor =' android/app/build.gradle | grep -oP '\d+')
          PATCH=$(grep 'versionPatch =' android/app/build.gradle | grep -oP '\d+')
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Get Commit Info
        id: get-commit
        run: |
          echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Environment Variables
        run: |
          pnpm generate:env:release \
            --build-type "Release" \
            --node-env "production" \
            --myanimelist-client-id "${{ vars.MYANIMELIST_CLIENT_ID }}" \
            --anilist-client-id "${{ vars.ANILIST_CLIENT_ID }}"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo $KEYSTORE_B64 | base64 --decode > android/app/release.keystore

      - name: Make Gradlew Executable
        run: cd android && chmod +x ./gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          pnpm rock build:android --variant release \
            --extra-params "--build-cache -PreactNativeArchitectures=${{ matrix.abi }} -PcommitCount=${{ needs.prepare.outputs.commit_count }}"
          mv android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/SoraReader-v${{ needs.prepare.outputs.version }}-r${{ needs.prepare.outputs.commit_count }}-${{ matrix.apk_suffix }}.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: "SoraReader v${{ needs.prepare.outputs.version }}"
          body: ${{ needs.prepare.outputs.commit_msg }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          files: |
            android/app/build/outputs/apk/release/SoraReader-v${{ needs.prepare.outputs.version }}-r${{ needs.prepare.outputs.commit_count }}-${{ matrix.apk_suffix }}.apk
