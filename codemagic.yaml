# Codemagic CI for SoraReader (release only).
#
# Setup sekali di dashboard Codemagic (App settings -> Environment variable groups):
#   - sora_env: MYANIMELIST_CLIENT_ID, ANILIST_CLIENT_ID
#   - android_keystore: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   - github_publish: GH_PAT (token dengan akses Contents Read & Write ke repo ini)

workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
    environment:
      node: 22
      java: 17
      groups:
        - sora_env
        - android_keystore
        - github_publish
      vars:
        KEYSTORE_FILE: release.keystore
        NODE_ENV: production
        CI_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
      - name: Generate release env file
        script: |
          pnpm run generate:env:release \
            --build-type "Release" \
            --node-env "production" \
            --myanimelist-client-id "$MYANIMELIST_CLIENT_ID" \
            --anilist-client-id "$ANILIST_CLIENT_ID"
      - name: Install Android SDK components
        script: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"
          for i in 1 2 3; do
            if "$SDKMANAGER" "ndk;27.1.12297006"; then
              break
            fi
            echo "NDK install attempt $i failed, retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006" "$ANDROID_HOME/.temp"
            sleep 5
            if [ "$i" = 3 ]; then
              echo "NDK install failed after 3 attempts"
              exit 1
            fi
          done
      - name: Decode keystore
        script: |
          python3 -c "import base64, os; open('android/app/release.keystore', 'wb').write(base64.b64decode(os.environ['KEYSTORE_B64']))"
      - name: Verify keystore
        script: |
          if ! keytool -list -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore check FAILED: KEYSTORE_B64 corrupt/truncated or KEYSTORE_PASSWORD/KEY_ALIAS wrong."
            echo "Re-paste the full base64 and double-check passwords in Codemagic env groups."
            exit 1
          fi
          echo "Keystore OK."
      - name: Build release APK
        script: |
          chmod +x android/gradlew
          pnpm rock build:android --variant release
      - name: Publish to GitHub Releases
        script: |
          TAG="codemagic-${CM_COMMIT:0:7}-$(date +%Y%m%d%H%M)"
          FILES=(android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab)
          EXISTING=()
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done
          GH_TOKEN="$GH_PAT" gh release create "$TAG" "${EXISTING[@]}" \
            --title "SoraReader $TAG" \
            --generate-notes
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
